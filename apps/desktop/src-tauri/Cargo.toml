[package]
name = "toolbox-desktop"
version = "2.0.0"
description = "ToolBox 2.0 desktop shell"
authors = ["shendongjuns"]
edition = "2021"
rust-version = "1.89"

[lib]
name = "toolbox_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tiny_http = "0.12"
sha2 = "0.10"
# Argon2id 密码哈希：与云端保持同一算法与参数档位
argon2 = "0.6"
password-hash = { version = "0.6", features = ["rand_core"] }
hex = "0.4"
rand = "0.8"
log = "0.4"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
# SSH / SFTP：纯 Rust 实现，无 OpenSSL 依赖
# 用 ring 而不是 aws-lc-rs：后者在 Windows 上需要 NASM，打包会失败
russh = { version = "0.64", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "2"
aes-gcm = "0.10"
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true