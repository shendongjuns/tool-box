[package]
name = "toolbox-desktop"
version = "2.0.0"
description = "ToolBox 2.0 desktop shell"
authors = ["shendongjuns"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "toolbox_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tiny_http = "0.12"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
log = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
