name: dartssh2
version: 3.3.1
description: SSH and SFTP client written in pure Dart, aiming to be feature-rich as well as easy to use.
homepage: https://github.com/vicajilau/dartssh2
repository: https://github.com/vicajilau/dartssh2
issue_tracker: https://github.com/vicajilau/dartssh2/issues
topics:
  - ssh
  - sftp
  - ssh-client
  - network
  - security

environment:
  # 必须与主包（toolbox）的 SDK 约束一致：本包物理位于主包 lib/ 内，
  # 语言版本不一致会触发 "The language version override has to be the same in
  # the library and its part(s)" 编译错误。
  sdk: ^3.13.0

dependencies:
  asn1lib: ^1.5.8
  convert: ^3.1.2
  meta: ^1.16.0
  pointycastle: ^4.0.0
  pinenacl: ^0.6.0

dev_dependencies:
  build_runner: ^2.4.12
  dart_code_metrics_presets: ^2.20.0
  lints: ">=4.0.0 <7.0.0"
  test: ^1.25.15

false_secrets:
  - test
