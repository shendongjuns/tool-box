name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Remove system WiX 4 (jpackage 仅支持 WiX 3)
        shell: pwsh
        run: |
          $newPath = ($env:PATH -split ';' | Where-Object { $_ -notlike '*WiX*' }) -join ';'
          echo "$newPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: Build MSI
        shell: pwsh
        run: |
          $VERSION = $env:GITHUB_REF -replace 'refs/tags/v', ''
          .\gradlew.bat :app:packageMsi "-PappVersion=$VERSION"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/compose/binaries/main/msi/工具箱-*.msi
