name: Release

# 只由 tag 触发 —— 推送到 main 不会产生 release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # 创建 release 并上传附件
  packages: write # 推送 Docker 镜像到 ghcr.io

jobs:
  # 发布前跑一遍检查，避免把坏版本发出去
  verify:
    name: 发布前检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # 排除桌面端：cargo check 在 Linux 上需要 GTK/glib 系统库，
      # ubuntu runner 没有。桌面端由 desktop job 在 Windows 上检查。
      - run: pnpm -r --if-present --filter '!@toolbox/desktop' typecheck
      - run: pnpm test

  desktop:
    name: 构建 Windows 产物
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建前端
        run: pnpm --filter @toolbox/web build

      - name: 打包安装程序
        # 不需要签名密钥：本项目未启用 Tauri 自动更新，
        # 签名只用于更新校验，这里用不上。
        run: pnpm --filter @toolbox/desktop build

      - name: 生成免安装包
        run: node apps/desktop/scripts/make-portable.mjs

      # 上传到 GitHub Release。softprops 会：
      #   1. 用 tag 名创建 release（不存在则新建）
      #   2. 把文件作为附件上传
      #   3. body_path 读取发布说明
      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ToolBox ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/portable/*.zip
          fail_on_unmatched_files: true

  server-image:
    name: 构建服务端镜像
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 仓库名可能含大写，ghcr 要求全小写
      - name: 规范化镜像名
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
