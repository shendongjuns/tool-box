name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Windows
        env:
          APP_VERSION: ${{ github.ref_name }}  # 例如 v1.2.0
        run: |
          $ver = $env:APP_VERSION.TrimStart('v')
          # Runner.rc 内嵌模板版本 1.0.0，显式传 --build-name 使 exe 文件版本与 tag 一致。
          flutter build windows --release --build-name $ver --build-number 1

      - name: Compress portable zip
        shell: bash
        run: |
          cd build/windows/x64/runner/Release
          # 用 * 而非 . ：7z 对 . 参数会生成带 ./ 前缀的条目（解压后出现 . 目录）
          7z a ../../../../../ToolBox-portable.zip *

      # wangyucode/setup-innosetup action 已不可用（repository not found），
      # 改用 windows-latest 自带 chocolatey 安装 Inno Setup 6。
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        env:
          APP_VERSION: ${{ github.ref_name }}  # 例如 v1.2.0
        run: |
          $ver = $env:APP_VERSION.TrimStart('v')
          $env:APP_VERSION = $ver
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$ver .github/installer/toolbox.iss

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ToolBox-Setup-*.exe
            ToolBox-portable.zip
