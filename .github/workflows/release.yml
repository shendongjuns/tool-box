name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Oracle JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'oracle'

      - name: Build
        shell: pwsh
        run: |
          $VERSION = $env:GITHUB_REF -replace 'refs/tags/v', ''
          .\gradlew.bat :app:createDistributable "-PappVersion=$VERSION"
          .\gradlew.bat :app:packageMsi "-PappVersion=$VERSION"

      - name: Package ZIP
        shell: pwsh
        run: |
          $VERSION = $env:GITHUB_REF -replace 'refs/tags/v', ''
          Compress-Archive -Path "app\build\compose\binaries\main\app\工具箱\*" -DestinationPath "工具箱-$VERSION.zip"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            工具箱-*.zip
            app/build/compose/binaries/main/msi/工具箱-*.msi
