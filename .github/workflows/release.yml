name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Install WiX 3
        shell: pwsh
        run: |
          $wixDir = "C:\wix3"
          Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3112rtm/wix311-binaries.zip" -OutFile "$env:RUNNER_TEMP\wix3.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\wix3.zip" -DestinationPath $wixDir
          echo "$wixDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8
          echo "WIX=$wixDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Build MSI
        shell: pwsh
        run: |
          $VERSION = $env:GITHUB_REF -replace 'refs/tags/v', ''
          .\gradlew.bat :app:packageMsi "-PappVersion=$VERSION" "-PpackageName=ToolBox"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/compose/binaries/main/msi/ToolBox-*.msi
