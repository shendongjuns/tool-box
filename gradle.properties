# JVM 参数
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true

# Kotlin 与 Compose 版本
kotlin.version=2.3.0
compose.version=1.11.1

# 本地 JDK 路径（不提交，在用户级配置或环境变量中设置）：
# 方式一：在 ~/.gradle/gradle.properties 中添加：
#   org.gradle.java.home=D:/Environment/jdk/jdk-25.0.3
# 方式二：设置 JAVA_HOME 环境变量指向 JDK 25
# GitHub Actions 通过 setup-java 自动设置 JAVA_HOME
