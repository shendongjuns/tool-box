name: toolbox
description: "ToolBox — a modern Windows desktop toolbox with a ForUI-based interface, built with Flutter."
publish_to: 'none'

# 版本号三段式 + 构建号。CI 发版时用 `--build-name`（取 git tag）覆盖 exe 内嵌版本。
version: 1.5.0+1

environment:
  # forui 0.26.x 要求 Dart >=3.13.0 / Flutter >=3.47.0，此处声明真实下限。
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  window_manager: ^0.5.2      # 窗口初始化 / 几何记忆 / 关窗拦截
  flutter_riverpod: ^3.4.2    # 状态管理（设置、页面导航、监控）
  file_picker: ^12.0.0        # 私钥选择、备份导出/导入的文件对话框
  forui: ^0.26.0              # 全部界面组件与主题
  dartssh2:
    path: lib/third_party/dartssh2   # SSH/SFTP（vendor 后做过传输优化）
  xterm:
    path: lib/third_party/xterm      # 终端模拟（vendor 后做过性能调整）
  tray_manager: ^0.5.3        # 托盘常驻
  archive: ^3.6.1             # 数据备份的 zip 打包/解包

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # 系统托盘图标（托盘常驻用）。
  # tray_manager 在 Windows 下按 `<exe>/data/flutter_assets/<资源键>` 解析路径，
  # 所以图标必须打成资源；内容与 windows/runner/resources/app_icon.ico 一致。
  assets:
    - assets/tray_icon.ico

  # 字体统一使用 Windows 系统字体 Microsoft YaHei UI（微软雅黑），
  # 无需打包字体资产，故此处不声明 fonts 段。
