# 只运行应用本身。对外暴露方式（反向代理 / 隧道 / 直连）由部署者决定。
services:
  toolbox:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: toolbox/server:2.0.0
    container_name: toolbox
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 7788
      HOST: 0.0.0.0
      DATABASE_PATH: /app/data/toolbox.db
      TRUST_PROXY: "true"
      SESSION_TTL_DAYS: 30
      LOG_LEVEL: info
    volumes:
      - ./data:/app/data
    ports:
      # 默认只绑定本机；需要局域网访问时改成 "7788:7788"
      - "127.0.0.1:7788:7788"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7788/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
