# 只跑应用本身。HTTPS、域名、证书全部交给宿主机的 nginx。
services:
  toolbox:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: toolbox/server:2.0.0
    container_name: toolbox
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_PATH: /app/data/toolbox.db
      # 在 nginx 后面：信任 X-Forwarded-* 头
      TRUST_PROXY: "true"
      SESSION_TTL_DAYS: 30
      # 一次性注册口令，留空则不校验
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      LOG_LEVEL: info
    volumes:
      - ./data:/app/data
    ports:
      # 只监听本机，nginx 通过 127.0.0.1:3000 反代；不直接对外暴露
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
